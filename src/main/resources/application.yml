spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

  sql:
    init:
      data-locations: classpath:seed.sql
      mode: always

u2net:
  model:
    path: ${U2NET_MODEL_PATH:${user.home}/.cache/u2net.onnx}

resnet:
  model:
    path: ${RESNET_MODEL_PATH:${user.home}/.cache/traced_resnet50.pt}

cloudinary:
  url: ${CLOUDINARY_URL}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

preq:
  prices:
    threshold-percentage: 0.40
    proximity-meters: 200.0
    cold-start-minimum-reports: 3
    pending-validation-deviation-min: 0.10
    pending-validation-deviation-max: 0.20
    average-monthly-inflation: 0.03
  trust:
    minimum-score: 0.25
    recovery-per-report: 0.01
    fixed-penalty: 0.05
  embeddings:
    consensus-size: 3
    similarity-threshold: 0.78
    expiry-days: 365
  disputes:
    required: 3